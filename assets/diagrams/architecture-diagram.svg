<svg viewBox="0 0 940 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2D3FE0"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F5A623"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="480" fill="#ffffff"/>
  <text x="470" y="32" fill="#111111" font-size="18" font-weight="bold" text-anchor="middle">EduSphere — High-Level Architecture</text>

  <!-- Mobile App -->
  <rect x="30" y="190" width="190" height="100" rx="12" fill="#2D3FE0"/>
  <text x="125" y="228" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Mobile App</text>
  <text x="125" y="250" fill="#ffffff" font-size="11" text-anchor="middle">React Native + Expo</text>
  <text x="125" y="266" fill="#ffffff" font-size="11" text-anchor="middle">(axios + React Query)</text>

  <!-- Express API -->
  <rect x="360" y="170" width="220" height="140" rx="12" fill="#000000"/>
  <text x="470" y="200" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Express REST API</text>
  <text x="470" y="222" fill="#ffffff" font-size="11" text-anchor="middle">TypeScript · Zod validation</text>
  <text x="470" y="240" fill="#ffffff" font-size="11" text-anchor="middle">Bearer token auth</text>
  <text x="470" y="258" fill="#ffffff" font-size="11" text-anchor="middle">Rate limiting · pino logging</text>
  <text x="470" y="280" fill="#ffffff" font-size="11" fill-opacity="0.8" text-anchor="middle">(separate backend repo)</text>

  <!-- Supabase -->
  <rect x="680" y="80" width="230" height="220" rx="12" fill="#059669"/>
  <text x="795" y="112" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Supabase</text>
  <line x1="700" y1="124" x2="880" y2="124" stroke="#ffffff" stroke-opacity="0.4"/>
  <text x="795" y="150" fill="#ffffff" font-size="12" text-anchor="middle">PostgreSQL Database</text>
  <text x="795" y="172" fill="#ffffff" font-size="12" text-anchor="middle">Auth (GoTrue)</text>
  <text x="795" y="194" fill="#ffffff" font-size="12" text-anchor="middle">Storage (avatars, resources)</text>
  <text x="795" y="222" fill="#ffffff" font-size="11" fill-opacity="0.85" text-anchor="middle">Schema versioned via</text>
  <text x="795" y="238" fill="#ffffff" font-size="11" fill-opacity="0.85" text-anchor="middle">node-pg-migrate (29 migrations)</text>

  <!-- LiveKit Cloud -->
  <rect x="360" y="380" width="220" height="80" rx="12" fill="#F5A623"/>
  <text x="470" y="415" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">LiveKit Cloud</text>
  <text x="470" y="437" fill="#ffffff" font-size="11" text-anchor="middle">Real-time audio/video calls</text>

  <!-- Arrows: Mobile -> Express -->
  <line x1="220" y1="230" x2="355" y2="225" stroke="#2D3FE0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="288" y="215" fill="#2D3FE0" font-size="11" text-anchor="middle">HTTPS + Bearer token</text>

  <!-- Arrows: Express -> Supabase (supabase-js: auth/storage) -->
  <line x1="580" y1="210" x2="675" y2="170" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="655" y="170" fill="#059669" font-size="10" text-anchor="end">supabase-js (Auth, Storage)</text>

  <!-- Arrows: Express -> Supabase (pg pool: direct Postgres) -->
  <line x1="580" y1="250" x2="675" y2="250" stroke="#2D3FE0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="628" y="242" fill="#2D3FE0" font-size="10" text-anchor="middle">pg Pool (direct SQL)</text>

  <!-- Arrows: Express -> LiveKit (token issuance) -->
  <line x1="470" y1="310" x2="470" y2="375" stroke="#F5A623" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="530" y="345" fill="#F5A623" font-size="10" text-anchor="middle">issues room token</text>

  <!-- Arrows: Mobile <-> LiveKit direct media -->
  <path d="M 210 290 C 260 340, 320 400, 355 415" stroke="#F5A623" stroke-width="2" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="230" y="365" fill="#F5A623" font-size="10" text-anchor="middle">WebRTC media (direct)</text>

  <text x="470" y="465" fill="#666666" font-size="11" text-anchor="middle">The Express API is a real application layer — not a thin pass-through — with its own routing, validation, and business logic</text>
</svg>
